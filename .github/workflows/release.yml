name: release

# On a version tag (v1.0.0), attach each plugin as a zip to the tag's GitHub release, for
# claude.ai organizations that upload plugins instead of syncing the marketplace.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/check.py
      - name: Zip the plugins
        run: |
          mkdir -p dist
          cd plugins
          for p in */; do
            p="${p%/}"
            zip -qr "../dist/$p.zip" "$p" -x "$p/evals/*"
          done
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-from-tag
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
